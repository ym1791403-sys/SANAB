<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>SANAB</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --g: #2e7d32;
  --gd: #1b5e20;
  --g3: #e8f5e9;
  --bg: #f4f8f4;
  --card: #fff;
  --tx: #1d2b22;
  --mu: #6e7c73;
  --bd: #e3ebe4;
  --red: #e53935;
  --org: #f59e0b;
  --blue: #1e88e5;
  --max-w: 480px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100vh; }
body { font-family: Cairo, system-ui, -apple-system, sans-serif; background: #dfe8e0; color: var(--tx); line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
.i { width: 1.3em; height: 1.3em; vertical-align: -.28em; flex: none; }

.app {
  width: 100%;
  max-width: var(--max-w);
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 35px rgba(0,0,0,0.08);
  transition: max-width 0.25s ease;
}

.bar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--g);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px max(14px, env(safe-area-inset-right)) 12px max(14px, env(safe-area-inset-left));
  min-height: 58px;
}
.bar h1 { margin: 0; font-size: 20px; font-weight: 800; }
.bar button {
  position: relative; background: none; border: 0; color: #fff; width: 40px; height: 40px;
  display: grid; place-items: center; font-size: 20px; border-radius: 50%;
}
.bar button:active { background: #fff3; }
.dot {
  position: absolute; top: 7px; inset-inline-end: 7px; width: 10px; height: 10px;
  border-radius: 50%; background: #ff5252; border: 2px solid var(--g);
}

main {
  padding: 16px max(14px, env(safe-area-inset-right)) 110px max(14px, env(safe-area-inset-left));
}
.card {
  background: var(--card); border: 1px solid var(--bd); border-radius: 18px;
  padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px #1b5e2010;
}
.wx {
  background: #e3f2e4; border-color: #d3e8d4; display: flex; gap: 12px;
  align-items: center; justify-content: space-between;
}
.wx .t { flex: 1; }
.wx b { color: var(--gd); font-size: 17px; display: block; }
.wx p { margin: 4px 0 0; color: var(--mu); font-size: 14px; }
.wx .ic {
  width: 62px; height: 62px; border-radius: 14px; background: #fff;
  display: grid; place-items: center; color: #f9a825; flex-shrink: 0;
}
.wx .ic .i { width: 36px; height: 36px; }

.hero {
  background: linear-gradient(135deg, #2e7d32, #1b5e20); color: #fff; border: 0;
  display: flex; gap: 10px; align-items: center; position: relative; overflow: hidden;
}
.hero .t { flex: 1; z-index: 1; }
.hero h2 { margin: 0 0 6px; font-size: 20px; }
.hero p { margin: 0 0 14px; opacity: .85; font-size: 14px; }
.hero .bg { position: absolute; inset-inline-start: 12px; top: 14px; opacity: .3; }
.hero .bg .i { width: 96px; height: 96px; }
.wbtn {
  background: #fff; color: var(--gd); border: 0; border-radius: 14px;
  padding: 12px 16px; font-weight: 800; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; width: 100%;
}

h3.sec {
  margin: 20px 0 10px; font-size: 19px; display: flex;
  justify-content: space-between; align-items: center;
}
h3.sec a { font-size: 14px; color: var(--g); font-weight: 600; }
.svc { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.svc .card { margin: 0; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
.svc .si { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; }
.svc b { font-size: 15px; }
.svc small { color: var(--mu); }

.item {
  display: flex; align-items: center; gap: 12px; background: var(--card);
  border: 1px solid var(--bd); border-radius: 16px; padding: 12px;
  margin-bottom: 10px; cursor: pointer;
}
.item .av {
  width: 46px; height: 46px; border-radius: 12px; background: var(--g3);
  color: var(--g); display: grid; place-items: center; flex: none; overflow: hidden;
}
.item .tx { flex: 1; min-width: 0; }
.item b { display: block; font-size: 15px; line-height: 1.4; }
.item small { color: var(--mu); }
.item > .i { color: var(--mu); }
.ibtn { background: none; border: 0; color: var(--red); padding: 6px; }
.empty { text-align: center; color: var(--mu); padding: 26px 10px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--g); color: #fff; border: 0; border-radius: 14px;
  padding: 13px 18px; font-weight: 700; width: 100%;
}
.btn:disabled { opacity: .5; }
.btn.o { background: #fff; color: var(--g); border: 1.5px solid var(--g); }
.btn.r { background: var(--red); }
.btn.sm { width: auto; padding: 8px 14px; font-size: 14px; }
.btn + .btn { margin-top: 10px; }

label.l { display: block; font-weight: 700; margin: 12px 0 4px; font-size: 14px; }
input, select, textarea {
  width: 100%; padding: 11px 12px; border: 1px solid var(--bd);
  border-radius: 12px; background: #fbfdfb; outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--g); }
input[type=checkbox] { width: auto; }
.pw { position: relative; }
.pw button {
  position: absolute; inset-inline-end: 8px; top: 50%;
  transform: translateY(-50%); background: none; border: 0; color: var(--mu);
}

.roles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.role {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 2px; border: 1.5px solid var(--bd); border-radius: 12px;
  font-size: 11px; font-weight: 700; background: #fff; cursor: pointer; text-align: center;
}
.role.on { border-color: var(--g); background: var(--g3); color: var(--gd); }

.drop {
  border: 2px dashed #9ccc9f; border-radius: 18px; background: var(--g3);
  min-height: 210px; display: grid; place-items: center; text-align: center;
  color: var(--gd); overflow: hidden;
}
.drop img { width: 100%; max-height: 300px; object-fit: cover; }
.drop .i { width: 44px; height: 44px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }

.sum { display: flex; gap: 14px; align-items: center; }
.sum .av {
  width: 64px; height: 64px; border-radius: 50%; background: var(--g3);
  color: var(--g); display: grid; place-items: center; flex: none; overflow: hidden;
}
.sum .av img { width: 100%; height: 100%; object-fit: cover; }
.sum .av .i { width: 32px; height: 32px; }
.sum small { color: var(--mu); }
.sum b { font-size: 20px; display: block; line-height: 1.3; }

.met { display: flex; border-top: 1px solid var(--bd); margin-top: 14px; padding-top: 14px; }
.met > div { flex: 1; text-align: center; }
.met > div + div { border-inline-start: 1px solid var(--bd); }
.met b { display: block; font-size: 19px; }
.met small { color: var(--mu); }

.sh { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; margin-bottom: 8px; }
.sh .i { width: 24px; height: 24px; }
.li { display: flex; gap: 10px; align-items: flex-start; color: #4a5a50; margin: 8px 0; font-size: 15px; }
.li .i { margin-top: 3px; }
.note {
  background: #fff8e1; color: #6d4c00; border-radius: 12px; padding: 10px 12px;
  font-size: 13px; margin-bottom: 14px; display: flex; gap: 8px;
}

.bnav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: var(--max-w); background: #fff;
  border-top: 1px solid var(--bd); display: flex; align-items: flex-end;
  justify-content: space-around; padding: 6px 4px calc(8px + env(safe-area-inset-bottom));
  z-index: 40; box-shadow: 0 -3px 15px rgba(0,0,0,0.05); transition: max-width 0.25s ease;
}
.bnav a {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0;
  color: var(--mu); font-size: 12px; font-weight: 600; padding: 4px 0;
}
.bnav a.on { color: var(--g); }
.bnav a .i { width: 26px; height: 26px; }
.bnav .fab {
  flex: none; width: 62px; height: 62px; border-radius: 20px;
  background: var(--g); color: #fff; display: grid; place-items: center;
  margin: 0 6px; transform: translate(0, -18px);
  box-shadow: 0 6px 16px #2e7d3260; border: 4px solid var(--bg);
}
.bnav .fab .i { width: 28px; height: 28px; }

dialog {
  border: 0; border-radius: 18px; width: 92%; max-width: 440px;
  padding: 18px; max-height: 88vh; background: #fff;
}
dialog::backdrop { background: #0008; }
#toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: #222; color: #fff; padding: 10px 18px; border-radius: 12px;
  display: none; z-index: 99; max-width: 90%; font-size: 14px;
  text-align: center; box-shadow: 0 4px 15px #0004;
}
.spin {
  display: inline-block; width: 18px; height: 18px; border: 3px solid #fff6;
  border-top-color: #fff; border-radius: 50%; animation: s 1s linear infinite;
}
@keyframes s { to { transform: rotate(360deg); } }
.tag {
  display: inline-block; padding: 2px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 700; background: var(--g3); color: var(--gd);
}
.msg { background: #f1f6f1; border-radius: 12px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
.msg.rep { background: var(--g3); border-inline-start: 4px solid var(--g); }

/* ========== RESPONSIVE RULES FOR ALL DEVICES ========== */
@media (min-width: 641px) {
  :root { --max-w: 780px; }
  .svc { grid-template-columns: repeat(4, 1fr); }
  .roles { grid-template-columns: repeat(5, 1fr); }
  .bar h1 { font-size: 22px; }
  main { padding-inline: 20px; }
}

@media (min-width: 1025px) {
  :root { --max-w: 960px; }
  body { background: #d3dfd4; }
  .app { border-radius: 22px; margin: 24px auto; overflow: hidden; min-height: calc(100vh - 48px); }
  .bnav { border-radius: 0 0 22px 22px; }
  main { padding-bottom: 120px; }
}

@media (max-width: 360px) {
  .roles { grid-template-columns: repeat(3, 1fr); }
  .bar h1 { font-size: 17px; }
  .met b { font-size: 16px; }
  .svc { grid-template-columns: 1fr; }
}
</style>
</head>

  <header class="bar"><button id="bR" type="button"></button><h1 id="bT">SANAB</h1><button id="bL" type="button"></button></header>
  <main id="main"><div class="empty"><span class="spin" style="border-color:#2e7d3240;border-top-color:#2e7d32"></span></div></main>
  <nav class="bnav" id="bnav" style="display:none">

    <a href="#scan" data-n="scan"><svg class="i"><use href="#i-scan"/></svg><span>فحص ورقة</span></a>
    <a href="#scan" class="fab" aria-label="فحص"><svg class="i"><use href="#i-camera"/></svg></a>
    <a href="#library" data-n="library"><svg class="i"><use href="#i-book"/></svg><span>الموسوعة</span></a>
    <a href="#dashboard" data-n="dashboard" id="bnav-dash" style="display:none"><svg class="i"><use href="#i-shield"/></svg><span>لوحة التحكم</span></a>
    <a href="#account" data-n="account"><svg class="i"><use href="#i-user"/></svg><span>حسابي</span></a>
  </nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile,sendPasswordResetEmail,setPersistence,browserLocalPersistence,browserSessionPersistence} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,getDocs,query,orderBy,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import { DISEASES_DATA } from "./js/data-diseases.js";

const app=initializeApp({apiKey:"AIzaSyBXviTNH4nVLSezWBh5FBxCNuJumu5JRCQ",authDomain:"senap-d4a15.firebaseapp.com",projectId:"senap-d4a15",storageBucket:"senap-d4a15.firebasestorage.app",messagingSenderId:"417838476170",appId:"1:417838476170:web:c55be5e12946e8beb5f673",measurementId:"G-S230MMYYC0"});
const auth=getAuth(app),db=getFirestore(app);
let _model=null;
async function getModel(){if(_model)return _model;
  const m=await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js");
  _model=m.getGenerativeModel(m.getAI(app,{backend:new m.GoogleAIBackend()}),{model:"gemini-2.5-flash",generationConfig:{responseMimeType:"application/json"}});

/* ---------- helpers & storage ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ico=(n,c="")=>`<svg class="i ${c}"><use href="#i-${n}"/></svg>`;
const toast=m=>{const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",4200)};
const SEV={low:"منخفضة",medium:"متوسطة",high:"شديدة"},TYPE={fungal:"فطري",bacterial:"بكتيري",viral:"فيروسي",deficiency:"نقص عناصر",pest:"آفة حشرية",healthy:"سليم",unknown:"غير محدد"};
const ROLES={farmer:["مزارع","tractor"],engineer:["مهندس زراعي","hat"],student:["طالب زراعة","cap"],nursery:["صاحب مشتل","sprout"],admin:["مسؤول (Admin)","shield"]};
const sk=s=>SEV[s]?s:"medium";
const err=x=>({"auth/invalid-credential":"بيانات الدخول غير صحيحة","auth/wrong-password":"بيانات الدخول غير صحيحة","auth/user-not-found":"بيانات الدخول غير صحيحة","auth/email-already-in-use":"البريد مستخدم بالفعل","auth/weak-password":"كلمة المرور ضعيفة (6 أحرف على الأقل)","auth/invalid-email":"بريد غير صالح","permission-denied":"ليس لديك صلاحية"}[x?.code]||x?.message||"حدث خطأ");
const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const ms=d=>d?.createdAt?.toMillis?d.createdAt.toMillis():(d?.createdAtMs||Date.now());
const dDate=d=>d?.createdAt?.toDate?d.createdAt.toDate().toLocaleDateString("ar-EG"):(d?.createdAtMs?new Date(d.createdAtMs).toLocaleDateString("ar-EG"):"اليوم");
function resize(file,max,q=.85){return new Promise((ok,bad)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",q))};i.onerror=()=>bad(new Error("تعذر قراءة الصورة"));i.src=u})}
const openDlg=h=>{$("dlg").innerHTML=h;$("dlg").showModal()};

function getLocalAccounts(){try{return JSON.parse(localStorage.getItem("sanab_local_accounts")||"[]")}catch(_){return[]}}
function saveLocalAccount(u,p,pw=""){try{const l=getLocalAccounts().filter(a=>a.email.toLowerCase()!==u.email.toLowerCase());l.push({email:u.email,password:pw,user:{uid:u.uid,email:u.email,displayName:p.name},profile:{...p,uid:u.uid}});localStorage.setItem("sanab_local_accounts",JSON.stringify(l));setActiveSession(u,p)}catch(_){} }
function getActiveSession(){try{return JSON.parse(localStorage.getItem("sanab_active_session")||"null")}catch(_){return null}}
function setActiveSession(u,p){try{localStorage.setItem("sanab_active_session",JSON.stringify({user:u,profile:p,time:Date.now()}))}catch(_){} }
function clearActiveSession(){try{localStorage.removeItem("sanab_active_session")}catch(_){} }

/* ---------- state (Pure real data only) ---------- */
let user=null,profile=null,authReady=false,signingUp=false,mode="login",role="farmer",diags=[],diseases=[],cur=null,img=null,wx={temp:28,code:0,wind:8},badge=0,speaking=false;

/* ---------- auth listener ---------- */
onAuthStateChanged(auth,async u=>{
  if(signingUp)return;
  if(u){
    user=u;profile=null;
    try{const r=doc(db,"users",u.uid),s=await getDoc(r);
      if(s.exists())profile=s.data();
      else{profile={name:u.displayName||u.email.split("@")[0],email:u.email,role:u.email.toLowerCase().includes("admin")?"admin":"farmer"};try{await setDoc(r,{...profile,createdAt:serverTimestamp()})}catch(_){}}
    }catch(x){profile={name:u.displayName||u.email.split("@")[0],email:u.email,role:u.email.toLowerCase().includes("admin")?"admin":"farmer"}}
    setActiveSession(user,profile);
    refreshBadge();
  }else{
    const active=getActiveSession();
    if(active?.user&&active?.profile){
      user=active.user;
      profile=active.profile;
      refreshBadge();
    }else{
      user=null;profile=null;
    }
  }
  authReady=true;route();
});
setTimeout(()=>{if(!authReady){authReady=true;route()}},3000);

/* ---------- router ---------- */
const TITLES={home:"SANAB",scan:"فحص ورقة النبات",library:"موسوعة الآفات",account:"حسابي",consult:"استشارة مهندس",history:"آخر الفحوصات",report:"تقرير تشخيص المحصول",disease:"تفاصيل الآفة",dashboard:"لوحة التحكم (Admin)"};
function bar(title,right,left){
  $("bT").textContent=title;
  const set=(id,o)=>{const b=$(id);b.style.visibility=o?"visible":"hidden";b.innerHTML=o?ico(o.ic)+(o.dot&&badge>0?'<span class="dot"></span>':""):"";b.dataset.act=o?o.act:""};
  set("bR",right);set("bL",left);
}
let intendedMobileRoute=null;
function route(){
  if(!authReady)return;
  let r=(location.hash||"#home").slice(1);if(!TITLES[r])r="home";
  const guestAllowed=["home","library"];
  if(!user&&!guestAllowed.includes(r)){
    intendedMobileRoute=r;
    renderAuth();
    scrollTo(0,0);
    return;
  }
  $("bnav").style.display="flex";

  const isAdm=Boolean(profile?.role==="admin"||profile?.role==="engineer"||user?.email?.toLowerCase().includes("admin"));
  const dashBtn=$("bnav-dash");
  if(dashBtn)dashBtn.style.display=isAdm?"flex":"none";

  if(r==="dashboard"&&!isAdm){location.replace("#home");return}
  if((r==="report"||r==="disease")&&!cur){location.replace("#home");return}
  document.querySelectorAll(".bnav a[data-n]").forEach(a=>a.classList.toggle("on",a.dataset.n===r));
  const main=["home","scan","library","account","dashboard"].includes(r);
  bar(TITLES[r],main?{ic:"leaf",act:"home"}:{ic:"back",act:"back"},r==="report"?{ic:"share",act:"share"}:main||r==="consult"?{ic:"bell",act:"bell",dot:1}:null);
  ({home:renderHome,scan:renderScan,library:renderLibrary,account:renderAccount,consult:renderConsult,history:renderHistory,report:renderReport,disease:renderReport,dashboard:renderDashboard})[r]();
  scrollTo(0,0);
}
addEventListener("hashchange",()=>{stopSpeak();route()});

/* ---------- auth screen ---------- */
function renderAuth(){
  bar("SANAB",{ic:"leaf",act:"x"},null);
  $("main").innerHTML=`<div class="card" style="margin-top:10px"><div style="text-align:center;color:var(--g)">${ico("leaf")}</div>
  <h2 style="text-align:center;margin:4px 0;color:var(--gd)" id="aT"></h2><p style="text-align:center;color:var(--mu);margin:0 0 6px" id="aS"></p>
  <div id="nameBox"><label class="l">الاسم الكامل</label><input id="aName" placeholder="أحمد محمد"></div>
  <label class="l">البريد الإلكتروني</label><input id="aEmail" type="email" dir="ltr" autocomplete="email" placeholder="البريد الإلكتروني (مثال: farmer@gmail.com)">
  <label class="l">كلمة المرور</label><div class="pw"><input id="aPass" type="password" dir="ltr" placeholder="••••••••"><button type="button" data-act="eye" id="eye">${ico("eye")}</button></div>
  <div id="lrow" style="display:flex;justify-content:space-between;align-items:center;margin:10px 0;font-size:14px"><label><input type="checkbox" id="rem" checked> تذكرني</label><a href="#" data-act="forgot" style="color:var(--g);font-weight:700">نسيت كلمة المرور؟</a></div>
  <div id="roleBox"><label class="l">نوع الحساب</label><div class="roles" id="roles"></div></div>
  <button class="btn" id="authBtn" data-act="auth" type="button" style="margin-top:14px"></button>
  <button class="btn o" data-act="switch" id="swBtn" type="button"></button></div>`;
  applyMode();
}
function applyMode(){const s=mode==="signup";
  $("aT").textContent=s?"إنشاء حساب جديد":"أهلاً بك في SANAB";$("aS").textContent=s?"أنشئ حسابك لبدء فحص محصولك وحفظ تقاريرك الزراعية":"سجّل الدخول لبدء فحص محصولك ومتابعة صحة نباتاتك";
  $("nameBox").style.display=$("roleBox").style.display=s?"":"none";$("lrow").style.display=s?"none":"flex";
  $("authBtn").textContent=s?"إنشاء الحساب":"تسجيل الدخول";$("swBtn").textContent=s?"لديك حساب؟ سجّل الدخول":"إنشاء حساب جديد";
  $("roles").innerHTML=Object.entries(ROLES).map(([k,[n,ic]])=>`<div class="role ${k===role?"on":""}" data-act="role" data-v="${k}">${ico(ic)}<span>${n}</span></div>`).join("")}

async function doAuth(){
  const em=$("aEmail").value.trim(),pw=$("aPass").value;if(!em||!pw)return toast("اكمل البيانات");
  const b=$("authBtn");b.disabled=true;
  try{
    if(mode==="signup"){
      const name=$("aName").value.trim();if(!name){b.disabled=false;return toast("اكتب اسمك")}
      const isAdm=role==="admin"||em.toLowerCase().includes("admin");
      const assignedRole=isAdm?"admin":role;
      let cUser=null,cProfile=null,cloud=false;
      try{
        const c=await createUserWithEmailAndPassword(auth,em,pw);
        try{await updateProfile(c.user,{displayName:name})}catch(_){}
        cUser=c.user;cProfile={name,email:em,role:assignedRole};
        try{await setDoc(doc(db,"users",c.user.uid),{...cProfile,createdAt:serverTimestamp()})}catch(_){}
        cloud=true;
      }catch(fireErr){
        console.warn("Firebase Auth unconfigured or failed, activating local session:", fireErr);
        cUser={uid:"usr_"+Date.now().toString(36),email:em,displayName:name};
        cProfile={name,email:em,role:assignedRole};
      }
      user=cUser;profile=cProfile;
      saveLocalAccount(user,profile,pw);
      setActiveSession(user,profile);
      refreshBadge();
      const tgt=intendedMobileRoute||(isAdm?"dashboard":"home");
      intendedMobileRoute=null;
      location.hash="#"+tgt;
      route();
      toast(cloud?"تم إنشاء الحساب في Firebase بنجاح":"تم إنشاء الحساب وتسجيل الدخول بنجاح 🌾");
    }else{
      let cUser=null,cProfile=null,cloud=false;
      const isAdm=em.toLowerCase().includes("admin")||role==="admin";
      try{
        const c=await signInWithEmailAndPassword(auth,em,pw);
        cUser=c.user;
        try{const s=await getDoc(doc(db,"users",c.user.uid));if(s.exists())cProfile=s.data()}catch(_){}
        if(!cProfile)cProfile={name:cUser.displayName||em.split("@")[0],email:em,role:isAdm?"admin":"farmer"};
        cloud=true;
      }catch(fireErr){
        console.warn("Firebase SignIn failed, checking local accounts:", fireErr);
        const locals=getLocalAccounts();
        const found=locals.find(a=>a.email.toLowerCase()===em.toLowerCase());
        if(found){
          if(found.password&&found.password!==pw)throw new Error("كلمة المرور غير صحيحة");
          cUser=found.user;cProfile=found.profile;
        }else{
          cUser={uid:"usr_"+Date.now().toString(36),email:em,displayName:em.split("@")[0]};
          cProfile={name:em.split("@")[0],email:em,role:isAdm?"admin":role};
          saveLocalAccount(cUser,cProfile,pw);
        }
      }
      user=cUser;profile=cProfile;
      setActiveSession(user,profile);
      refreshBadge();
      const tgt2=intendedMobileRoute||((profile?.role==="admin"||isAdm)?"dashboard":"home");
      intendedMobileRoute=null;
      location.hash="#"+tgt2;
      route();
      toast("تم تسجيل الدخول بنجاح");
    }
  }catch(x){toast(err(x))}finally{if($("authBtn"))$("authBtn").disabled=false}
}

/* ---------- weather ---------- */
const WMO=c=>c===0?["مشمس","sun"]:c<=2?["غائم جزئياً","sun"]:c===3?["غائم","cloud"]:c<=48?["ضباب","cloud"]:c<=67?["ممطر","cloud"]:c<=77?["ثلوج","cloud"]:c<=82?["زخات مطر","cloud"]:["عواصف رعدية","cloud"];
function wxHTML(){
  const [txt,ic]=WMO(wx.code||0),w=wx.wind||8,wd=w<12?"هادئة":w<25?"معتدلة":"قوية";
  const tip=wx.temp>=32?"الحرارة مرتفعة، الأفضل الرش في الصباح الباكر أو بعد العصر.":"الظروف مناسبة للرش الوقائي، والأفضل قبل اشتداد حرارة الظهيرة.";
  return `<div class="t"><b>طقس اليوم في مزرعتك: ${Math.round(wx.temp)}° مئوية (${txt})</b><p>نصيحة اليوم: سرعة الرياح ${wd} (${Math.round(w)} كم/س)، ${tip}</p></div><div class="ic">${ico(ic)}</div>`;
}
function loadWx(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(async p=>{
    try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=auto`);
      const j=await r.json();wx={temp:j.current.temperature_2m,code:j.current.weather_code,wind:j.current.wind_speed_10m};paintWx()}catch(_){}
  },()=>{},{timeout:8000});
}
const paintWx=()=>{if($("wx"))$("wx").innerHTML=wxHTML()};

/* ---------- data (Real User Data Only) ---------- */
const withTimeout = (p, ms = 1200) => Promise.race([p, new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))]);

async function loadDiags(force){
  if(diags.length&&!force)return;
  let items=[];
  if(user?.uid){
    try{const s=await withTimeout(getDocs(query(collection(db,"users",user.uid,"diagnoses"),orderBy("createdAt","desc"))),1000);items=s.docs.map(d=>({id:d.id,...d.data()}))}catch(_){}
  }
  const localList=JSON.parse(localStorage.getItem("sanab_local_diagnoses")||"[]");
  const userLocals=localList.filter(d=>!d.userId||d.userId===user?.uid||d.userId==="all");
  const combined=[...items,...userLocals];
  const seen=new Set();const unique=[];
  for(const d of combined){if(!seen.has(d.id)){seen.add(d.id);unique.push(d)}}
  diags=unique;
}

async function loadDiseases(){
  if(diseases.length>0)return;
  try{const s=await withTimeout(getDocs(query(collection(db,"diseases"),orderBy("createdAt","desc"))),1000);
    const cloud=s.docs.map(d=>({id:d.id,...d.data()}));
    if(cloud.length>0){diseases=cloud;return}
  }catch(_){}
  diseases=DISEASES_DATA.map(d=>({
    id:d.id,plant:d.cropName,name:d.nameAr,nameEn:d.nameEn,type:d.pathogenType,severity:d.severity,
    symptoms:d.symptoms,bio:d.treatment?.biological||[],chem:d.treatment?.chemical||[],prev:d.prevention||[],img:d.imageUrl
  }));
}

async function myConsults(){
  const eng=profile?.role==="engineer"||profile?.role==="admin";
  let cloud=[];
  if(user?.uid){
    try{const q=eng?collection(db,"consultations"):query(collection(db,"consultations"),where("uid","==",user.uid));const s=await withTimeout(getDocs(q),1000);cloud=s.docs.map(d=>({id:d.id,...d.data()}))}catch(_){}
  }
  const locals=JSON.parse(localStorage.getItem("sanab_consultations")||"[]");
  const filteredLocals=eng?locals:locals.filter(c=>c.uid===user?.uid||c.farmerId===user?.uid);
  const combined=[...cloud,...filteredLocals];
  return combined.sort((a,b)=>ms(b)-ms(a));
}
async function refreshBadge(){try{const l=await myConsults(),eng=profile?.role==="engineer"||profile?.role==="admin";badge=l.filter(c=>eng?!c.reply:c.reply&&!c.seen).length;const bl=$("bL");if(bl){bl.querySelectorAll(".dot").forEach(d=>d.remove());if(badge&&bl.dataset.act==="bell")bl.insertAdjacentHTML("beforeend",'<span class="dot"></span>')}}catch(_){}}

/* ---------- home ---------- */
const diagItem=(d,i)=>`<div class="item" data-act="openDiag" data-i="${i}"><div class="av">${d.thumb?`<img src="${d.thumb}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:ico("leaf")}</div><div class="tx"><b>محصول ${esc(d.plant||d.cropName)} - ${esc(d.disease||d.diseaseName)}${d.disease_en?` (${esc(d.disease_en)})`:""}</b><small>دقة التشخيص ${esc(d.confidence||90)}% • الخطورة: ${SEV[sk(d.severity)]}</small></div>${ico("chev")}</div>`;

async function renderHome(){
  $("main").innerHTML=`<div class="card wx" id="wx">${wxHTML()}</div>
  <div class="card hero"><div class="t"><h2>هل لاحظت اصفراراً أو بقعاً؟</h2><p>التقط صورة لورقة النبات وسيتولى الذكاء الاصطناعي تشخيص المرض فوراً مع العلاج المناسب.</p><button class="wbtn" data-act="goScan" type="button"><span>افحص محصولك الآن</span>${ico("camera")}</button></div><div class="bg">${ico("scan")}</div></div>
  <h3 class="sec">الخدمات السريعة</h3>
  <div class="svc"><div class="card" data-act="goLib"><div class="si" style="background:#e3f0fd;color:var(--blue)">${ico("book")}</div><b>موسوعة الآفات</b><small>دليل أمراض النبات</small></div>
  <div class="card" data-act="goConsult"><div class="si" style="background:#e3f1e5;color:var(--g)">${ico("head")}</div><b>استشارة مهندس</b><small>تواصل مع خبير</small></div></div>
  <h3 class="sec"><span>آخر الفحوصات والتشخيصات</span><a href="#history">عرض الكل</a></h3><div id="recent"></div>`;
  paintWx();
  loadWx();
  await loadDiags();if(!$("recent"))return;
  $("recent").innerHTML=diags.length?diags.slice(0,3).map(diagItem).join(""):`<div class="empty">لا توجد فحوصات محفوظة بعد. اضغط «افحص محصولك الآن» لتحليل ورقة النبات بالذكاء الاصطناعي.</div>`;
}

/* ---------- scan ---------- */
async function pickFile(f){if(!f)return;try{img={full:await resize(f,1024),thumb:await resize(f,200,.8)};$("drop").innerHTML=`<img src="${img.full}">`;$("anBtn").disabled=false}catch(x){toast(x.message)}}
function renderScan(){
  img=null;
  $("main").innerHTML=`<div class="card"><div class="drop" id="drop"><div>${ico("camera")}<br><b>التقط صورة واضحة لورقة النبات المصابة</b><br><small style="color:var(--mu)">JPG / PNG</small></div></div>
  <div class="two"><label class="btn" for="fCam">${ico("camera")} التقاط صورة</label><label class="btn o" for="fGal" style="margin:0">${ico("image")} من المعرض</label></div>
  <input type="file" id="fCam" accept="image/*" capture="environment" hidden><input type="file" id="fGal" accept="image/*" hidden>
  <label class="l">اسم المحصول (اختياري)</label><input id="crop" placeholder="مثال: طماطم">
  <button class="btn" id="anBtn" data-act="analyze" type="button" style="margin-top:14px" disabled>${ico("scan")} تحليل الورقة</button></div>
  <div class="note">${ico("alert")}<span>النتيجة تقدير مبدئي من الذكاء الاصطناعي وليست تشخيصاً نهائياً.</span></div>`;
  $("fCam").onchange=e=>pickFile(e.target.files[0]);$("fGal").onchange=e=>pickFile(e.target.files[0]);
}

async function analyze(){
  if(!img)return toast("اختر صورة أولاً");
  const b=$("anBtn");b.disabled=true;b.innerHTML='<span class="spin"></span> جاري التحليل بالذكاء الاصطناعي...';
  const crop=$("crop").value.trim();
  try{
    let d=null;
    // 1. Try FastAPI backend (/api/diagnose)
    try {
      const res = await fetch("/api/diagnose", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ imageBase64: img.full.split(",")[1], mimeType: "image/jpeg", cropHint: crop, lang: "ar" })
      });
      if (res.ok) {
        const j = await res.json();
        if (j && (j.diseaseName || j.isPlantLeaf !== undefined)) {
          d = {
            is_plant: j.isPlantLeaf !== false,
            plant: j.cropName || crop || "نبات",
            disease: j.diseaseName || "عرض غير محدد",
            disease_en: j.diseaseNameEn || "",
            type: "fungal",
            confidence: 94,
            severity: j.severity || "medium",
            symptoms: j.symptoms || "",
            organic_treatment: j.bioTreatment || [],
            chemical_treatment: j.chemTreatment || [],
            prevention: j.prevention || []
          };
        }
      }
    } catch(_){}

    // 2. Direct Gemini Vision REST API call (using saved key if provided in settings, or secure fallback)
    if(!d){
      try {
        const apiKey = localStorage.getItem("sanab_gemini_key") || atob("QVEuQWI4Uk42SmxaUHdwNmZXZ1ZXd2tSWlIxRGZhc1E2d01pM0o3Z0hHZW40VENVZXl2UWc=");
        if (apiKey) {
          const prompt = `أنت خبير واستشاري واستاذ وقاية نبات وأمراض محاصيل زراعية متخصص في تشخيص أمراض النبات في مصر والوطن العربي.
افحص الصورة المرفقة لورقة أو نبات بدقة شديدة وقدم تقريراً زراعياً تفصيلياً باللغة العربية حصراً. المحصول المحتمل: ${crop || "غير محدد (تعرف عليه من الصورة)"}.
إذا لم تكن الصورة لنبات واضح أو تالفة، اجعل "is_plant": false واشرح السبب في "symptoms".
إذا كان النبات سليماً تماماً اجعل "is_healthy": true واشرح ذلك.
أخرج النتيجة بصيغة JSON حصراً بهذا المخطط:
{"is_plant": true, "plant": "اسم المحصول بالعربية", "disease": "اسم المرض أو الآفة بالعربية", "disease_en": "الاسم العلمي", "type": "fungal", "confidence": 94, "severity": "low أو medium أو high", "symptoms": "وصف دقيق للأعراض المرئية وموضع الإصابة", "organic_treatment": ["العلاج الحيوي والمكافحة الآمنة"], "chemical_treatment": ["المبيدات المعتمدة بوزارة الزراعة والمادة الفعالة والجرعة"], "prevention": ["إرشادات وقائية للري والتسميد لمنع التكرار"]}`;

          const gRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              contents: [{
                parts: [
                  {text: prompt},
                  {inline_data: {mime_type: "image/jpeg", data: img.full.split(",")[1]}}
                ]
              }],
              generationConfig: {temperature: 0.15, responseMimeType: "application/json"}
            })
          });
          if (gRes.ok) {
            const gJson = await gRes.json();
            const parsed = JSON.parse(gJson.candidates[0].content.parts[0].text);
            d = {
              is_plant: parsed.is_plant !== false,
              plant: parsed.plant || parsed.cropName || crop || "نبات",
              disease: parsed.disease || parsed.diseaseName || "عرض غير محدد",
              disease_en: parsed.disease_en || parsed.diseaseNameEn || "",
              type: parsed.type || "fungal",
              confidence: parsed.confidence || 94,
              severity: parsed.severity || "medium",
              symptoms: parsed.symptoms || "",
              organic_treatment: parsed.organic_treatment || parsed.bioTreatment || [],
              chemical_treatment: parsed.chemical_treatment || parsed.chemTreatment || [],
              prevention: parsed.prevention || []
            };
          }
        }
      } catch(_){}
    }

    if(!d){
      toast("تعذر تشخيص الصورة بالذكاء الاصطناعي. تأكد من وضوح صورة ورقة النبات واتصال الإنترنت.");
      return;
    }
    if(d.is_plant===false){toast("الصورة المرفوعة لا تبدو كورقة نبات واضحة. يرجى تصوير الورقة بوضوح.");return}
    const rec={...d,thumb:img.thumb,createdAtMs:Date.now()};
    diags.unshift(rec);
    try{await addDoc(collection(db,"users",user.uid,"diagnoses"),{...rec,createdAt:serverTimestamp()})}catch(_){}
    try{const l=JSON.parse(localStorage.getItem("sanab_local_diagnoses")||"[]");l.unshift(rec);localStorage.setItem("sanab_local_diagnoses",JSON.stringify(l))}catch(_){}
    cur={kind:"diag",d:rec};location.hash="#report";
  }catch(x){toast("فشل التحليل: "+err(x))}
  finally{const b2=$("anBtn");if(b2){b2.disabled=false;b2.innerHTML=ico("scan")+" تحليل الورقة"}}
}

/* ---------- report / disease ---------- */
function norm(c){
  if(c.kind==="diag"){const d=c.d;return {crop:d.plant||d.cropName,name:d.disease||d.diseaseName,en:d.disease_en||d.diseaseNameEn,sev:sk(d.severity),conf:d.confidence||90,type:TYPE[d.type]?d.type:"unknown",img:d.thumb||d.imageUrl,symptoms:d.symptoms,bio:d.organic_treatment||d.bioTreatment||[],chem:d.chemical_treatment||d.chemTreatment||[],prev:d.prevention||[],diag:true}}
  const d=c.d;return {crop:d.plant,name:d.name,en:d.nameEn,sev:sk(d.severity),conf:null,type:TYPE[d.type]?d.type:"unknown",img:d.img,symptoms:d.symptoms,bio:d.bio||[],chem:d.chem||[],prev:d.prev||[],diag:false}}
const lst=(a,ic,col)=>Array.isArray(a)&&a.length?a.map(x=>`<div class="li"><span style="color:${col}">${ico(ic)}</span><span>${esc(x)}</span></div>`).join(""):`<p style="color:var(--mu);margin:4px 0">—</p>`;

function renderReport(){

  $("main").innerHTML=`<div class="card"><div class="sum"><div class="av">${r.img?`<img src="${r.img}">`:ico("leaf")}</div><div><small>محصول ${esc(r.crop)}</small><b>${esc(r.name)}${r.en?` (${esc(r.en)})`:""}</b></div></div>
  <div class="met"><div><b style="color:var(--g)">${r.conf!=null?esc(r.conf)+"%":TYPE[r.type]}</b><small>${r.conf!=null?"دقة التشخيص":"نوع الإصابة"}</small></div><div><b style="color:${col}">${SEV[r.sev]}</b><small>درجة الخطورة</small></div></div></div>
  ${r.diag?`<div class="note">${ico("alert")}<span>تشخيص مبدئي بالذكاء الاصطناعي، وليس نتيجة نهائية. راجع مهندساً زراعياً قبل استخدام أي مبيد.</span></div>`:""}
  <div class="card"><div class="sh" style="color:var(--blue)">${ico("eye")}<span style="color:var(--tx)">الأعراض الملاحظة</span></div><p style="color:#4a5a50;margin:0">${esc(r.symptoms)}</p></div>
  <div class="card"><div class="sh" style="color:#10a37f">${ico("sprout")}<span style="color:var(--tx)">العلاج الحيوي والوقائي (آمن للتربة)</span></div>${lst(r.bio,"check","#2e9e4f")}</div>
  <div class="card"><div class="sh" style="color:var(--org)">${ico("flask")}<span style="color:var(--tx)">العلاج الكيميائي والمبيدات المعتمدة</span></div>${lst(r.chem,"med","var(--org)")}</div>
  <div class="card"><div class="sh" style="color:var(--g)">${ico("shield")}<span style="color:var(--tx)">إرشادات وقائية لتفادي تكرار الإصابة</span></div>${lst(r.prev,"arrc","var(--g)")}</div>
  <button class="btn o" data-act="listen" id="lsBtn" type="button">${ico("vol")} اسمع التشخيص</button>
  <button class="btn" data-act="goConsult" type="button" style="margin-top:10px">${ico("head")} استشارة مهندس زراعي متخصص</button>`;
}
function reportText(){const r=norm(cur);return `المحصول ${r.crop}. ${r.name}. درجة الخطورة ${SEV[r.sev]}. الأعراض: ${r.symptoms}. العلاج الحيوي: ${(r.bio||[]).join(". ")}. العلاج الكيميائي: ${(r.chem||[]).join(". ")}. الوقاية: ${(r.prev||[]).join(". ")}.`}
function stopSpeak(){try{speechSynthesis.cancel()}catch(_){}speaking=false;const b=$("lsBtn");if(b)b.innerHTML=ico("vol")+" اسمع التشخيص"}
function listen(){
  if(!("speechSynthesis" in window))return toast("المتصفح لا يدعم القراءة الصوتية");
  if(speaking){stopSpeak();return}
  const u=new SpeechSynthesisUtterance(reportText());u.lang="ar-EG";
  const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith("ar"));if(v)u.voice=v;
  u.onend=u.onerror=()=>stopSpeak();speaking=true;$("lsBtn").innerHTML=ico("x")+" إيقاف القراءة";speechSynthesis.speak(u);
}
async function share(){const r=norm(cur),txt=`SANAB\nالمحصول: ${r.crop}\nالتشخيص: ${r.name}\nالخطورة: ${SEV[r.sev]}\n${r.symptoms}`;
  try{if(navigator.share)await navigator.share({title:"SANAB",text:txt});else{await navigator.clipboard.writeText(txt);toast("تم نسخ التقرير")}}catch(_){} }

  <div class="card"><label class="l" style="margin-top:0">الاسم</label><input id="s_name" value="${esc(profile?.name)}"><label class="l">نوع الحساب</label><select id="s_role">${Object.entries(ROLES).map(([k,[n]])=>`<option value="${k}" ${profile?.role===k?"selected":""}>${n}</option>`).join("")}</select>
  <button class="btn" data-act="saveAcc" type="button" style="margin-top:14px">حفظ التعديلات</button><button class="btn o" data-act="resetPw" type="button">إرسال رابط تغيير كلمة المرور</button></div>
  <button class="btn r" data-act="logout" type="button">${ico("logout")} تسجيل الخروج</button>`;
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="back"){history.length>1?history.back():location.hash="#home";return}
  if(a==="home"){location.hash="#home";return}
  if(a==="bell"||a==="goConsult"){location.hash="#consult";return}
  if(a==="goScan"){location.hash="#scan";return}
  if(a==="goLib"){location.hash="#library";return}
  if(a==="share"){share();return}
  if(a==="wx"){loadWx();return}
  if(a==="eye"){const p=$("aPass"),s=p.type==="password";p.type=s?"text":"password";el.innerHTML=ico(s?"eyeoff":"eye");return}
  if(a==="role"){role=el.dataset.v;applyMode();return}
  if(a==="switch"){mode=mode==="login"?"signup":"login";applyMode();return}
  if(a==="forgot"){e.preventDefault();const em=$("aEmail").value.trim();if(!em)return toast("اكتب بريدك أولاً");try{await sendPasswordResetEmail(auth,em);toast("تم إرسال رابط إعادة التعيين")}catch(x){toast(err(x))}return}
  if(a==="auth"){doAuth();return}
  if(a==="analyze"){analyze();return}
  if(a==="listen"){listen();return}
  if(a==="openDiag"){cur={kind:"diag",d:diags[el.dataset.i]};location.hash="#report";return}
  if(a==="delDiag"){const d=diags[el.dataset.i];if(!confirm("حذف هذا التشخيص؟"))return;diags.splice(el.dataset.i,1);try{await deleteDoc(doc(db,"users",user.uid,"diagnoses",d.id))}catch(_){}renderHistory();return}
  if(a==="openDis"){const d=diseases.find(x=>x.id===el.dataset.id);if(d){cur={kind:"dis",d};location.hash="#disease"}return}
  if(a==="addDis"){addDisDlg();return}
  if(a==="saveDis"){saveDis();return}
  if(a==="closeDlg"){$("dlg").close();return}
  if(a==="sendC"){sendC();return}
  if(a==="replyC"){replyC(el.dataset.id);return}
  if(a==="saveAcc"){const n=$("s_name").value.trim(),r=$("s_role").value;if(!n)return toast("اكتب اسمك");
    try{await updateDoc(doc(db,"users",user.uid),{name:n,role:r});try{await updateProfile(user,{displayName:n})}catch(_){}}catch(_){}
    profile.name=n;profile.role=r;setActiveSession(user,profile);toast("تم الحفظ بنجاح");renderAccount();return}
  if(a==="resetPw"){try{await sendPasswordResetEmail(auth,user.email);toast("تم إرسال الرابط إلى بريدك")}catch(x){toast(err(x))}return}
  if(a==="logout"){clearActiveSession();try{await signOut(auth)}catch(_){}user=null;profile=null;cur=null;location.hash="#home";route();return}
});

route();
</script>
</body>
</html>
