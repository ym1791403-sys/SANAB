<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>SANAB</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2e7d32;--gd:#1b5e20;--g3:#e8f5e9;--bg:#f4f8f4;--card:#fff;--tx:#1d2b22;--mu:#6e7c73;--bd:#e3ebe4;--red:#e53935;--org:#f59e0b;--blue:#1e88e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{font-family:Cairo,system-ui,sans-serif;background:#dfe8e0;color:var(--tx);line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.i{width:1.3em;height:1.3em;vertical-align:-.28em;flex:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 30px #0002}
.bar{position:sticky;top:0;z-index:30;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;min-height:58px}
.bar h1{margin:0;font-size:20px;font-weight:800}.bar button{position:relative;background:none;border:0;color:#fff;width:40px;height:40px;display:grid;place-items:center;font-size:20px;border-radius:50%}.bar button:active{background:#fff3}
.dot{position:absolute;top:7px;inset-inline-end:7px;width:10px;height:10px;border-radius:50%;background:#ff5252;border:2px solid var(--g)}
main{padding:16px 14px 110px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #1b5e2010}
.wx{background:#e3f2e4;border-color:#d3e8d4;display:flex;gap:12px;align-items:center;justify-content:space-between}.wx .t{flex:1}.wx b{color:var(--gd);font-size:17px;display:block}.wx p{margin:4px 0 0;color:var(--mu);font-size:14px}
.wx .ic{width:62px;height:62px;border-radius:14px;background:#fff;display:grid;place-items:center;color:#f9a825}.wx .ic .i{width:36px;height:36px}
.hero{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;border:0;display:flex;gap:10px;align-items:center;position:relative;overflow:hidden}
.hero .t{flex:1;z-index:1}.hero h2{margin:0 0 6px;font-size:20px}.hero p{margin:0 0 14px;opacity:.85;font-size:14px}.hero .bg{position:absolute;inset-inline-start:12px;top:14px;opacity:.3}.hero .bg .i{width:96px;height:96px}
.wbtn{background:#fff;color:var(--gd);border:0;border-radius:14px;padding:12px 16px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
h3.sec{margin:20px 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}h3.sec a{font-size:14px;color:var(--g);font-weight:600}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:12px}.svc .card{margin:0;display:flex;flex-direction:column;gap:6px;cursor:pointer}.svc .si{width:46px;height:46px;border-radius:12px;display:grid;place-items:center}.svc b{font-size:15px}.svc small{color:var(--mu)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer}
.item .av{width:46px;height:46px;border-radius:12px;background:var(--g3);color:var(--g);display:grid;place-items:center;flex:none}.item .tx{flex:1;min-width:0}.item b{display:block;font-size:15px}.item small{color:var(--mu)}.item>.i{color:var(--mu)}
.ibtn{background:none;border:0;color:var(--red);padding:6px}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--g);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:700;width:100%}.btn:disabled{opacity:.5}.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}.btn.r{background:var(--red)}.btn.sm{width:auto;padding:8px 14px;font-size:14px}
.btn+.btn{margin-top:10px}
label.l{display:block;font-weight:700;margin:12px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:#fbfdfb;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--g)}input[type=checkbox]{width:auto}
.pw{position:relative}.pw button{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu)}
.roles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.role{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:1.5px solid var(--bd);border-radius:12px;font-size:11px;font-weight:700;background:#fff;cursor:pointer}.role.on{border-color:var(--g);background:var(--g3);color:var(--gd)}
.drop{border:2px dashed #9ccc9f;border-radius:18px;background:var(--g3);min-height:210px;display:grid;place-items:center;text-align:center;color:var(--gd);overflow:hidden}.drop img{width:100%;max-height:300px;object-fit:cover}.drop .i{width:44px;height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sum{display:flex;gap:14px;align-items:center}.sum .av{width:64px;height:64px;border-radius:50%;background:var(--g3);color:var(--g);display:grid;place-items:center;flex:none;overflow:hidden}.sum .av img{width:100%;height:100%;object-fit:cover}.sum .av .i{width:32px;height:32px}.sum small{color:var(--mu)}.sum b{font-size:20px;display:block;line-height:1.3}
.met{display:flex;border-top:1px solid var(--bd);margin-top:14px;padding-top:14px}.met>div{flex:1;text-align:center}.met>div+div{border-inline-start:1px solid var(--bd)}.met b{display:block;font-size:19px}.met small{color:var(--mu)}
.sv-low{color:#2e9e4f}.sv-medium{color:var(--org)}.sv-high{color:var(--red)}
.sh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;margin-bottom:8px}.sh .i{width:24px;height:24px}
.li{display:flex;gap:10px;align-items:flex-start;color:#4a5a50;margin:8px 0;font-size:15px}.li .i{margin-top:3px}
.note{background:#fff8e1;color:#6d4c00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:8px}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--bd);display:flex;align-items:flex-end;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--mu);font-size:12px;font-weight:600;padding:4px 0}.bnav a.on{color:var(--g)}.bnav a .i{width:26px;height:26px}
.bnav .fab{flex:none;width:62px;height:62px;border-radius:20px;background:var(--g);color:#fff;display:grid;place-items:center;margin:0 6px;transform:translateY(-18px);box-shadow:0 6px 16px #2e7d3260;border:4px solid var(--bg)}.bnav .fab .i{width:28px;height:28px}
dialog{border:0;border-radius:18px;width:92%;max-width:440px;padding:18px;max-height:88vh;background:#fff}dialog::backdrop{background:#0008}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:99;max-width:90%;font-size:14px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--g3);color:var(--gd)}
.msg{background:#f1f6f1;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}.msg.rep{background:var(--g3);border-inline-start:4px solid var(--g)}
</style>
</head>

function resize(file,max,q=.85){return new Promise((ok,bad)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",q))};i.onerror=()=>bad(new Error("تعذر قراءة الصورة"));i.src=u})}

function bar(title,right,left){
  $("bT").textContent=title;
  const set=(id,o)=>{const b=$(id);b.style.visibility=o?"visible":"hidden";b.innerHTML=o?ico(o.ic)+(o.dot&&badge>0?'<span class="dot"></span>':""):"";b.dataset.act=o?o.act:""};
  set("bR",right);set("bL",left);
}
function route(){
  if(!authReady)return;
  let r=(location.hash||"#home").slice(1);if(!TITLES[r])r="home";
  $("bnav").style.display=user?"flex":"none";
  if(!user){renderAuth();scrollTo(0,0);return}
  if((r==="report"||r==="disease")&&!cur){location.replace("#home");return}
  document.querySelectorAll(".bnav a[data-n]").forEach(a=>a.classList.toggle("on",a.dataset.n===r));
  const main=["home","scan","library","account"].includes(r);
  bar(TITLES[r],main?{ic:"leaf",act:"home"}:{ic:"back",act:"back"},r==="report"?{ic:"share",act:"share"}:main||r==="consult"?{ic:"bell",act:"bell",dot:1}:null);

/* ---------- weather ---------- */
const WMO=c=>c===0?["مشمس","sun"]:c<=2?["غائم جزئياً","sun"]:c===3?["غائم","cloud"]:c<=48?["ضباب","cloud"]:c<=67?["ممطر","cloud"]:c<=77?["ثلوج","cloud"]:c<=82?["زخات مطر","cloud"]:["عواصف رعدية","cloud"];
function wxHTML(){
  if(!wx)return `<div class="t"><b>طقس مزرعتك</b><p>فعّل الموقع لعرض طقس اليوم ونصيحة الرش.</p><button class="btn sm" data-act="wx" type="button" style="margin-top:8px">تفعيل الموقع</button></div><div class="ic">${ico("sun")}</div>`;
  if(wx.fail)return `<div class="t"><b>طقس مزرعتك</b><p>${esc(wx.fail)}</p><button class="btn sm" data-act="wx" type="button" style="margin-top:8px">إعادة المحاولة</button></div><div class="ic">${ico("cloud")}</div>`;
  const [txt,ic]=WMO(wx.code),w=wx.wind,wd=w<12?"هادئة":w<25?"معتدلة":"قوية",rain=wx.code>=51&&wx.code!==3&&wx.code<=99&&wx.code>=51;
  const tip=rain?"تجنب الرش اليوم بسبب الأمطار.":w>=25?"الرياح قوية، أجّل الرش لوقت أهدأ.":wx.temp>=32?"الحرارة مرتفعة، الأفضل الرش في الصباح الباكر أو بعد العصر.":"الظروف مناسبة للرش الوقائي، والأفضل قبل اشتداد حرارة الظهيرة.";
  return `<div class="t"><b>طقس اليوم في مزرعتك: ${Math.round(wx.temp)}° مئوية (${txt})</b><p>نصيحة اليوم: سرعة الرياح ${wd} (${Math.round(w)} كم/س)، ${tip}</p></div><div class="ic">${ico(ic)}</div>`}
function loadWx(){
  if(!navigator.geolocation){wx={fail:"المتصفح لا يدعم تحديد الموقع."};return paintWx()}
  navigator.geolocation.getCurrentPosition(async p=>{
    try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,weather_code,wind_speed_10m&wind_speed_unit=kmh&timezone=auto`);
      const j=await r.json();wx={temp:j.current.temperature_2m,code:j.current.weather_code,wind:j.current.wind_speed_10m}}catch(e){wx={fail:"تعذر تحميل بيانات الطقس."}}
    paintWx()},()=>{wx={fail:"لم يتم السماح بالوصول للموقع."};paintWx()},{timeout:12000});
}
const paintWx=()=>{if($("wx"))$("wx").innerHTML=wxHTML()};

/* ---------- scan ---------- */
async function pickFile(f){if(!f)return;try{img={full:await resize(f,1024),thumb:await resize(f,200,.8)};$("drop").innerHTML=`<img src="${img.full}">`;$("anBtn").disabled=false}catch(x){toast(x.message)}}
function renderScan(){
  img=null;
  $("main").innerHTML=`<div class="card"><div class="drop" id="drop"><div>${ico("camera")}<br><b>التقط صورة واضحة لورقة النبات المصابة</b><br><small style="color:var(--mu)">JPG / PNG</small></div></div>
  <div class="two"><label class="btn" for="fCam">${ico("camera")} التقاط صورة</label><label class="btn o" for="fGal" style="margin:0">${ico("image")} من المعرض</label></div>
  <input type="file" id="fCam" accept="image/*" capture="environment" hidden><input type="file" id="fGal" accept="image/*" hidden>

  <div class="note">${ico("alert")}<span>النتيجة تقدير مبدئي من الذكاء الاصطناعي وليست تشخيصاً نهائياً.</span></div>`;
  $("fCam").onchange=e=>pickFile(e.target.files[0]);$("fGal").onchange=e=>pickFile(e.target.files[0]);
}
async function analyze(){
  if(!img)return toast("اختر صورة أولاً");
  const b=$("anBtn");b.disabled=true;b.innerHTML='<span class="spin"></span> جاري التحليل...';
  const crop=$("crop").value.trim();
  const prompt=`أنت خبير أمراض نباتات. حلل صورة ورقة النبات وأجب بصيغة JSON فقط بهذه الحقول:
{"is_plant":boolean,"plant":"اسم المحصول بالعربية","disease":"اسم المرض أو المشكلة بالعربية","disease_en":"الاسم بالإنجليزية","type":"fungal|bacterial|viral|deficiency|pest|healthy|unknown","confidence":رقم من 0 إلى 100,"severity":"low|medium|high","symptoms":"وصف الأعراض الظاهرة في الصورة بالعربية البسيطة","organic_treatment":[نصائح علاج حيوي آمن للتربة],"chemical_treatment":[مبيدات أو مواد معتمدة مع التنبيه لاتباع الجرعة الموصى بها],"prevention":[إرشادات وقائية لتفادي تكرار الإصابة]}
إن لم تكن الصورة نبات فاجعل is_plant=false. إن كان النبات سليماً فاجعل type="healthy". كن صادقاً في الثقة ولا تبالغ فيها. ${crop?"المحصول حسب المستخدم: "+crop:""}`;
  try{
    let d=null;
    try {
      const res = await fetch("/api/diagnose", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ imageBase64: img.full.split(",")[1], mimeType: "image/jpeg", cropHint: crop, lang: "ar" })
      });
      if (res.ok) {
        const j = await res.json();
        d = {
          is_plant: j.isPlantLeaf !== false,
          plant: j.cropName || crop || "نبات",
          disease: j.diseaseName || "عرض غير محدد",
          disease_en: j.diseaseNameEn || "",
          type: "fungal",
          confidence: 88,
          severity: j.severity || "medium",
          symptoms: j.symptoms || "",
          organic_treatment: j.bioTreatment || [],
          chemical_treatment: j.chemTreatment || [],
          prevention: j.prevention || []
        };
      }
    } catch(e){}
    if(!d){
      const r=await (await getModel()).generateContent([prompt,{inlineData:{mimeType:"image/jpeg",data:img.full.split(",")[1]}}]);
      d=JSON.parse(r.response.text());
    }
    if(d.is_plant===false){toast("الصورة لا تبدو لنبات. ارفع صورة واضحة لورقة النبات.");return}
    const rec={...d,thumb:img.thumb,createdAt:serverTimestamp()};
    const ref=await addDoc(collection(db,"users",user.uid,"diagnoses"),rec);
    diags=[];cur={kind:"diag",d:{...d,thumb:img.thumb,id:ref.id}};location.hash="#report";
  }catch(x){console.error(x);toast("فشل التحليل: "+err(x))}
  finally{const b2=$("anBtn");if(b2){b2.disabled=false;b2.innerHTML=ico("scan")+" تحليل الورقة"}}
}

/* ---------- report / disease ---------- */
function norm(c){
  if(c.kind==="diag"){const d=c.d;return {crop:d.plant,name:d.disease,en:d.disease_en,sev:sk(d.severity),conf:d.confidence,type:TYPE[d.type]?d.type:"unknown",img:d.thumb,symptoms:d.symptoms,bio:d.organic_treatment,chem:d.chemical_treatment,prev:d.prevention,diag:true}}
  const d=c.d;return {crop:d.plant,name:d.name,en:d.nameEn,sev:sk(d.severity),conf:null,type:TYPE[d.type]?d.type:"unknown",img:null,symptoms:d.symptoms,bio:d.bio,chem:d.chem,prev:d.prev,diag:false}}
const lst=(a,ic,col)=>Array.isArray(a)&&a.length?a.map(x=>`<div class="li"><span style="color:${col}">${ico(ic)}</span><span>${esc(x)}</span></div>`).join(""):`<p style="color:var(--mu);margin:4px 0">—</p>`;
function renderReport(){
  const r=norm(cur),col={low:"#2e9e4f",medium:"var(--org)",high:"var(--red)"}[r.sev];
  $("main").innerHTML=`<div class="card"><div class="sum"><div class="av">${r.img?`<img src="${r.img}">`:ico("leaf")}</div><div><small>محصول ${esc(r.crop)}</small><b>${esc(r.name)}${r.en?` (${esc(r.en)})`:""}</b></div></div>
  <div class="met"><div><b style="color:var(--g)">${r.conf!=null?esc(r.conf)+"%":TYPE[r.type]}</b><small>${r.conf!=null?"ثقة مبدئية (تقدير)":"نوع الإصابة"}</small></div><div><b style="color:${col}">${SEV[r.sev]}</b><small>درجة الخطورة</small></div></div></div>
  ${r.diag?`<div class="note">${ico("alert")}<span>تشخيص مبدئي بالذكاء الاصطناعي، وليس نتيجة نهائية. راجع مهندساً زراعياً قبل استخدام أي مبيد.</span></div>`:""}
  <div class="card"><div class="sh" style="color:var(--blue)">${ico("eye")}<span style="color:var(--tx)">الأعراض الملاحظة</span></div><p style="color:#4a5a50;margin:0">${esc(r.symptoms)}</p></div>
  <div class="card"><div class="sh" style="color:#10a37f">${ico("sprout")}<span style="color:var(--tx)">العلاج الحيوي والوقائي (آمن للتربة)</span></div>${lst(r.bio,"check","#2e9e4f")}</div>
  <div class="card"><div class="sh" style="color:var(--org)">${ico("flask")}<span style="color:var(--tx)">العلاج الكيميائي والمبيدات المعتمدة</span></div>${lst(r.chem,"med","var(--org)")}</div>
  <div class="card"><div class="sh" style="color:var(--g)">${ico("shield")}<span style="color:var(--tx)">إرشادات وقائية لتفادي تكرار الإصابة</span></div>${lst(r.prev,"arrc","var(--g)")}</div>
  <button class="btn o" data-act="listen" id="lsBtn" type="button">${ico("vol")} اسمع التشخيص</button>
  <button class="btn" data-act="goConsult" type="button" style="margin-top:10px">${ico("head")} استشارة مهندس زراعي متخصص</button>`;
}
function reportText(){const r=norm(cur);return `المحصول ${r.crop}. ${r.name}. درجة الخطورة ${SEV[r.sev]}. الأعراض: ${r.symptoms}. العلاج الحيوي: ${(r.bio||[]).join(". ")}. العلاج الكيميائي: ${(r.chem||[]).join(". ")}. الوقاية: ${(r.prev||[]).join(". ")}. هذه نتيجة مبدئية، راجع مهندساً زراعياً.`}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=false;const b=$("lsBtn");if(b)b.innerHTML=ico("vol")+" اسمع التشخيص"}
function listen(){
  if(!("speechSynthesis" in window))return toast("المتصفح لا يدعم القراءة الصوتية");
  if(speaking){stopSpeak();return}
  const u=new SpeechSynthesisUtterance(reportText());u.lang="ar-EG";
  const v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith("ar"));if(v)u.voice=v;
  u.onend=u.onerror=()=>stopSpeak();speaking=true;$("lsBtn").innerHTML=ico("x")+" إيقاف القراءة";speechSynthesis.speak(u);
}
async function share(){const r=norm(cur),txt=`SANAB\nالمحصول: ${r.crop}\nالتشخيص: ${r.name}\nالخطورة: ${SEV[r.sev]}\n${r.symptoms}`;
  try{if(navigator.share)await navigator.share({title:"SANAB",text:txt});else{await navigator.clipboard.writeText(txt);toast("تم نسخ التقرير")}}catch(e){}}

/* ---------- library ---------- */
async function renderLibrary(){
  $("main").innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px"><input id="q" placeholder="ابحث عن مرض أو محصول..." style="flex:1">${profile?.role==="engineer"?`<button class="btn sm" data-act="addDis" type="button">${ico("plus")} إضافة</button>`:""}</div><div id="dl"><div class="empty">جارٍ التحميل...</div></div>`;
  await loadDiseases();if(!$("dl"))return;paintLib();$("q").oninput=paintLib;
}
function paintLib(){
  const q=($("q")?.value||"").trim().toLowerCase();
  const l=diseases.filter(d=>!q||((d.name||"")+" "+(d.nameEn||"")+" "+(d.plant||"")).toLowerCase().includes(q));
  $("dl").innerHTML=l.length?l.map(d=>`<div class="item" data-act="openDis" data-id="${d.id}"><div class="av">${ico("leaf")}</div><div class="tx"><b>${esc(d.name)}${d.nameEn?` (${esc(d.nameEn)})`:""}</b><small>${esc(d.plant)} • الخطورة: ${SEV[sk(d.severity)]}</small></div>${ico("chev")}</div>`).join("")
   :`<div class="empty">${diseases.length?"لا نتائج مطابقة.":"لا توجد آفات في الموسوعة بعد. "+(profile?.role==="engineer"?"أضف أول آفة بزر «إضافة».":"يضيفها المهندسون الزراعيون هنا.")}</div>`;
}
function addDisDlg(){
  openDlg(`<h3 style="margin:0 0 6px">إضافة آفة للموسوعة</h3>
  <label class="l">المحصول</label><input id="n_plant"><label class="l">اسم المرض</label><input id="n_name"><label class="l">الاسم بالإنجليزية</label><input id="n_en" dir="ltr">
  <label class="l">النوع</label><select id="n_type">${["fungal","bacterial","viral","deficiency","pest"].map(k=>`<option value="${k}">${TYPE[k]}</option>`).join("")}</select>
  <label class="l">الخطورة</label><select id="n_sev">${["low","medium","high"].map(k=>`<option value="${k}">${SEV[k]}</option>`).join("")}</select>
  <label class="l">الأعراض</label><textarea id="n_sym" rows="3"></textarea>
  <label class="l">العلاج الحيوي (كل نقطة في سطر)</label><textarea id="n_bio" rows="3"></textarea>
  <label class="l">العلاج الكيميائي (كل نقطة في سطر)</label><textarea id="n_chem" rows="3"></textarea>
  <label class="l">الوقاية (كل نقطة في سطر)</label><textarea id="n_prev" rows="3"></textarea>
  <button class="btn" data-act="saveDis" type="button" style="margin-top:14px">حفظ</button><button class="btn o" data-act="closeDlg" type="button">إلغاء</button>`);
}
async function saveDis(){const v=i=>$(i).value.trim();
  const d={plant:v("n_plant"),name:v("n_name"),nameEn:v("n_en"),type:v("n_type"),severity:v("n_sev"),symptoms:v("n_sym"),bio:lines($("n_bio").value),chem:lines($("n_chem").value),prev:lines($("n_prev").value)};
  if(!d.plant||!d.name||!d.symptoms)return toast("المحصول والاسم والأعراض مطلوبة");
  try{await addDoc(collection(db,"diseases"),{...d,createdBy:user.uid,createdAt:serverTimestamp()});$("dlg").close();await loadDiseases();paintLib()}catch(x){toast(err(x))}}

/* ---------- consult ---------- */
async function renderConsult(){
  const eng=profile?.role==="engineer";
  $("main").innerHTML=`<div class="empty">جارٍ التحميل...</div>`;
  let list=[];try{list=await myConsults()}catch(x){toast(err(x))}
  if(!eng)await loadDiags();
  if(!$("main")||location.hash!=="#consult")return;
  const form=eng?"":`<div class="card"><b>اسأل مهندساً زراعياً</b><textarea id="cMsg" rows="4" placeholder="اكتب مشكلتك أو سؤالك..." style="margin-top:8px"></textarea>
    ${diags.length?`<label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px"><input type="checkbox" id="cAtt"> إرفاق آخر تشخيص (${esc(diags[0].plant)} - ${esc(diags[0].disease)})</label>`:""}
    <button class="btn" data-act="sendC" type="button">${ico("send")} إرسال</button></div>`;
  $("main").innerHTML=form+`<h3 class="sec">${eng?"استفسارات المزارعين":"استشاراتي"}</h3>`+(list.length?list.map(c=>`<div class="card"><small style="color:var(--mu)">${eng?esc(c.name)+" • ":""}${dDate(c)}</small>
    <div class="msg">${esc(c.message)}${c.attach?`<br><span class="tag">${esc(c.attach)}</span>`:""}</div>
    ${c.reply?`<div class="msg rep"><b>${esc(c.replyBy||"مهندس")}:</b> ${esc(c.reply)}</div>`:eng?`<textarea id="r_${c.id}" rows="2" placeholder="اكتب ردك..."></textarea><button class="btn sm" data-act="replyC" data-id="${c.id}" type="button" style="margin-top:8px">إرسال الرد</button>`:`<small style="color:var(--mu)">في انتظار رد المهندس...</small>`}</div>`).join(""):`<div class="empty">لا توجد استشارات.</div>`);
  if(!eng){const un=list.filter(c=>c.reply&&!c.seen);for(const c of un){try{await updateDoc(doc(db,"consultations",c.id),{seen:true})}catch(e){}}if(un.length){badge=0;document.querySelectorAll(".dot").forEach(d=>d.remove())}}
}
async function sendC(){const m=$("cMsg").value.trim();if(!m)return toast("اكتب رسالتك");
  const att=$("cAtt")?.checked&&diags[0]?`${diags[0].plant} - ${diags[0].disease}`:"";
  try{await addDoc(collection(db,"consultations"),{uid:user.uid,name:profile.name,role:profile.role,message:m,attach:att,reply:"",seen:true,createdAt:serverTimestamp()});toast("تم إرسال استشارتك");renderConsult()}catch(x){toast(err(x))}}
async function replyC(id){const t=$("r_"+id).value.trim();if(!t)return toast("اكتب الرد");
  try{await updateDoc(doc(db,"consultations",id),{reply:t,replyBy:profile.name,repliedAt:serverTimestamp(),seen:false});toast("تم إرسال الرد");refreshBadge();renderConsult()}catch(x){toast(err(x))}}

/* ---------- account ---------- */
async function renderAccount(){
  await loadDiags();if(location.hash!=="#account")return;
  $("main").innerHTML=`<div class="card sum"><div class="av" style="font-weight:800;font-size:24px">${esc((profile?.name||"?")[0])}</div><div><b>${esc(profile?.name)}</b><small>${ROLES[profile?.role]?ROLES[profile.role][0]:""} • ${esc(user.email)}</small></div></div>
  <div class="card"><div class="met" style="border:0;margin:0;padding:0"><div><b style="color:var(--g)">${diags.length}</b><small>إجمالي الفحوصات</small></div></div></div>
  <div class="card"><label class="l" style="margin-top:0">الاسم</label><input id="s_name" value="${esc(profile?.name)}"><label class="l">نوع الحساب</label><select id="s_role">${Object.entries(ROLES).map(([k,[n]])=>`<option value="${k}" ${profile?.role===k?"selected":""}>${n}</option>`).join("")}</select>
  <button class="btn" data-act="saveAcc" type="button" style="margin-top:14px">حفظ التعديلات</button><button class="btn o" data-act="resetPw" type="button">إرسال رابط تغيير كلمة المرور</button></div>
  <button class="btn r" data-act="logout" type="button">${ico("logout")} تسجيل الخروج</button>`;
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="back"){history.length>1?history.back():location.hash="#home";return}
  if(a==="home"){location.hash="#home";return}
  if(a==="bell"||a==="goConsult"){location.hash="#consult";return}
  if(a==="goScan"){location.hash="#scan";return}
  if(a==="goLib"){location.hash="#library";return}
  if(a==="share"){share();return}
  if(a==="wx"){loadWx();return}
  if(a==="eye"){const p=$("aPass"),s=p.type==="password";p.type=s?"text":"password";el.innerHTML=ico(s?"eyeoff":"eye");return}
  if(a==="role"){role=el.dataset.v;applyMode();return}
  if(a==="switch"){mode=mode==="login"?"signup":"login";applyMode();return}
  if(a==="forgot"){e.preventDefault();const em=$("aEmail").value.trim();if(!em)return toast("اكتب بريدك أولاً");try{await sendPasswordResetEmail(auth,em);toast("تم إرسال رابط إعادة التعيين")}catch(x){toast(err(x))}return}
  if(a==="auth"){doAuth();return}
  if(a==="analyze"){analyze();return}
  if(a==="listen"){listen();return}
  if(a==="openDiag"){cur={kind:"diag",d:diags[el.dataset.i]};location.hash="#report";return}
  if(a==="delDiag"){const d=diags[el.dataset.i];if(!confirm("حذف هذا التشخيص؟"))return;try{await deleteDoc(doc(db,"users",user.uid,"diagnoses",d.id));renderHistory()}catch(x){toast(err(x))}return}
  if(a==="openDis"){const d=diseases.find(x=>x.id===el.dataset.id);if(d){cur={kind:"dis",d};location.hash="#disease"}return}
  if(a==="addDis"){addDisDlg();return}
  if(a==="saveDis"){saveDis();return}
  if(a==="closeDlg"){$("dlg").close();return}
  if(a==="sendC"){sendC();return}
  if(a==="replyC"){replyC(el.dataset.id);return}
  if(a==="saveAcc"){const n=$("s_name").value.trim(),r=$("s_role").value;if(!n)return toast("اكتب اسمك");
    try{await updateDoc(doc(db,"users",user.uid),{name:n,role:r});try{await updateProfile(user,{displayName:n})}catch(x){}profile.name=n;profile.role=r;toast("تم الحفظ");renderAccount()}catch(x){toast(err(x))}return}
  if(a==="resetPw"){try{await sendPasswordResetEmail(auth,user.email);toast("تم إرسال الرابط إلى بريدك")}catch(x){toast(err(x))}return}
  if(a==="logout"){await signOut(auth);cur=null;diags=[];wx=wx;location.hash="#home";return}
});
route();
</script>
</body>
</html>
